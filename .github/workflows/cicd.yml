name: Build for macOS

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# https://stackoverflow.com/a/72408109/6942800
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege: only needs to read code for building.
permissions:
  contents: read

jobs:
  build:
    name: Build Boring Notch
    strategy:
      matrix:
        platform:
          - macOS
        xcode:
          - ^16
        scheme:
          - boringNotch
    # macos-latest now resolves to macos-26, which does not ship Xcode 16.
    # Keep this legacy main-branch build on an image with the requested toolchain.
    runs-on: macos-15
    steps:
    - name: Code Checkout
      # TODO: pin to immutable SHA
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - # TODO: pin to immutable SHA
      uses: mxcl/xcodebuild@d3ee9b419c1be9a988086c58fe0988f32d99cfc5 # v3.6.0
      with:
        xcode: ${{ matrix.xcode }}
        platform: ${{ matrix.platform }}
        scheme: ${{ matrix.scheme }}
        action: build
        verbosity: xcpretty
        upload-logs: always
        configuration: release

    - name: Package built app for local verification
      run: |
        set -euo pipefail
        APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" \
          -path '*/Build/Products/Release/Boring Notch.app' -type d -print -quit)"
        if [[ -z "$APP_PATH" ]]; then
          echo "::error::Boring Notch.app was not found in Xcode's Release products"
          exit 1
        fi
        ditto -c -k --sequesterRsrc --keepParent \
          "$APP_PATH" "$RUNNER_TEMP/Boring Notch.app.zip"

    - name: Upload built app
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Boring Notch macOS app
        path: ${{ runner.temp }}/Boring Notch.app.zip
        if-no-files-found: error
