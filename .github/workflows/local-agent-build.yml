name: Local Agent Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build_reusable.yml
    with:
      source_sha: ${{ github.sha }}
      version: ""
      build_number: ${{ github.run_number }}
      xcode_version: "26.6"
      update_channel: dev
    secrets: inherit
